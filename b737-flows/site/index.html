<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B737 Normal Procedures · карта полёта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  --navy: #0b1f3f; --navy-2: #13305e; --ink: #0b1630; --ink-2: #44526e; --line: #d5dce8; --bg: #f4f6fa; --paper: #fff;
  --path: #1d3f8f; --hl: #ffe27a; --link: #3fb96a; --red: #d62828;
  --fo: #1d5fd6; --capt: #d4570b; --both: #0b8a5a; --pf: #7b2cbf; --pm: #0f8b8d;
  --cl: #6b3fd1; --ng: #0f7b8a;
  --font: 'IBM Plex Sans', system-ui, sans-serif; --cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 16px; line-height: 1.45; overflow: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
::selection { background: var(--fo); color: #fff; }

/* ============ TOP BAR ============ */
.top { position: fixed; inset: 0 0 auto 0; height: 58px; z-index: 40; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.brand { font-family: var(--cond); font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand small { display: block; font-family: var(--font); font-weight: 400; font-size: 11px; color: #a9bbdc; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: rgba(255,255,255,.08); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: none; color: #cfdaf0; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.tabs button.on { background: #fff; color: var(--navy); }
.quiz { border: 1px solid rgba(255,255,255,.35); background: none; color: #fff; border-radius: 8px; padding: 7px 10px; font-weight: 600; font-size: 14px; white-space: nowrap; }
body.quizmode .quiz { background: #ffe27a; color: var(--navy); border-color: #ffe27a; }

/* ============ MAP ============ */
#view { position: fixed; inset: 58px 0 0 0; }
#mapWrap { position: absolute; inset: 0; touch-action: none; cursor: grab; background: #fbfbf7; }
#mapWrap.drag { cursor: grabbing; }
#map { width: 100%; height: 100%; display: block; }
.zoom { position: absolute; left: 14px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
.zoom button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--navy); color: #fff; font-size: 22px; font-weight: 700; box-shadow: 0 6px 16px -6px rgba(0,0,0,.5); }
.legend { position: absolute; right: 14px; bottom: 16px; z-index: 5; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
.legend span { display: flex; gap: 8px; align-items: center; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; }
.mp text { font-family: var(--font); }
.mp .node { cursor: pointer; }
.mp .node:hover .hl { fill: #ffd23d; }
.mp .node.sel .hl { stroke: var(--navy); stroke-width: 4; }
.mp .hand { font-family: 'Caveat', cursive; }

/* ============ OTHER TABS ============ */
.page { position: fixed; inset: 58px 0 0 0; overflow: auto; padding: 24px; display: none; }
.page.on { display: block; }
.page h1 { font-family: var(--cond); font-size: 28px; margin-bottom: 10px; }
.apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.apps .a { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.apps .a b { font-family: var(--cond); font-size: 18px; display: block; }
.apps .a small { color: var(--ink-2); }
.diff { width: 100%; border-collapse: collapse; background: #fff; }
.diff th { background: var(--navy); color: #fff; text-align: left; padding: 8px; font-family: var(--cond); position: sticky; top: -24px; }
.diff td { border-top: 1px solid var(--line); padding: 7px 8px; vertical-align: top; font-size: 14px; }
.diff td.cl { background: #f5f1fd; } .diff td.ng { background: #eef9fa; }

/* ============ PROCEDURE PANEL ============ */
#panel { position: fixed; top: 58px; right: 0; bottom: 0; width: min(760px, 100%); z-index: 30; background: var(--bg); box-shadow: -18px 0 40px -20px rgba(0,0,0,.45); transform: translateX(105%); transition: transform .35s cubic-bezier(.16,1,.3,1); display: flex; flex-direction: column; }
#panel.open { transform: none; }
.ph { background: var(--navy); color: #fff; padding: 14px 16px 12px; }
.ph .sec { font-family: var(--cond); font-size: 13px; color: #a9bbdc; }
.ph h2 { font-family: var(--cond); font-size: 24px; line-height: 1.15; margin: 2px 0 8px; }
.ph .meta { font-size: 14px; color: #dbe5f7; }
.ph .meta b { color: #fff; }
.ph .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ph .bar button { border: 1px solid rgba(255,255,255,.3); background: none; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.ph .bar .x { margin-left: auto; background: #fff; color: var(--navy); border-color: #fff; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; color: #fff; margin-left: 6px; vertical-align: 2px; }
.chip.CL { background: var(--cl); } .chip.NG { background: var(--ng); }
.pbody { overflow: auto; padding: 12px 12px 60px; flex: 1; -webkit-overflow-scrolling: touch; }
details.sec { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
details.sec > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-family: var(--cond); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px; }
details.sec > summary::before { content: "▸"; color: var(--ink-2); transition: transform .2s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary .cnt { margin-left: auto; font-family: var(--font); font-weight: 500; font-size: 13px; color: var(--ink-2); }
.sbody { padding: 0 12px 12px; }
.rolebar { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
details.step { border-top: 1px solid var(--line); }
details.step > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 9px 4px; }
details.step > summary .n { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-family: var(--cond); font-weight: 700; }
details.step > summary .p { font-weight: 600; line-height: 1.25; }
details.step > summary .p small { display: block; font-weight: 400; color: var(--ink-2); font-size: 13px; }
details.step > summary .r { font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.lines { padding: 2px 4px 12px 48px; }
.ln { padding: 3px 0; }
.ln.act { font-weight: 600; }
.ln .dots { color: #9aa6bd; }
.ln .val { font-family: var(--cond); font-weight: 700; color: var(--path); white-space: nowrap; }
.ln.ver { color: #22324f; padding-left: 16px; position: relative; }
.ln.ver::before { content: "✓"; position: absolute; left: 0; color: var(--both); font-weight: 700; }
.ln.instr { font-style: italic; color: #22324f; }
.box { margin: 6px 0; padding: 8px 11px; border-left: 5px solid; border-radius: 8px; font-size: 15px; }
.box b.k { font-family: var(--cond); letter-spacing: .04em; margin-right: 6px; }
.box.N { background: #e8f0fe; border-color: #1d5fd6; } .box.C { background: #fff4d6; border-color: #b7791f; } .box.W { background: #fde8e8; border-color: #c0262d; } .box.Q { background: #fff0f6; border-color: #b83280; }
.hd { margin: 6px 0 2px; font-family: var(--cond); font-weight: 700; font-size: 13px; color: #fff; background: #5b6b88; padding: 1px 8px; border-radius: 6px; width: fit-content; }
.tg { display: inline-block; font-family: var(--cond); font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; color: #fff; white-space: nowrap; }
.tg.CL { background: var(--cl); } .tg.NG { background: var(--ng); } .tg.T { background: #5b6b88; }
.fig svg { width: 100%; height: auto; display: block; border-radius: 10px; background: #eee; }
.fig + .fig { margin-top: 10px; }
.fig h4 { font-family: var(--cond); font-size: 14px; margin: 4px 0 6px; color: var(--ink-2); }
.figlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin: 8px 0; }
.figlegend span { display: inline-flex; gap: 6px; align-items: center; }
.figlegend i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.none { padding: 12px; background: #f6f8fc; border: 2px dashed var(--line); border-radius: 10px; color: var(--ink-2); font-size: 14px; }
.mem { list-style: none; counter-reset: m; columns: 2; column-gap: 20px; }
.mem li { counter-increment: m; break-inside: avoid; padding: 3px 0 3px 34px; position: relative; font-size: 15px; }
.mem li::before { content: counter(m); position: absolute; left: 0; top: 4px; width: 26px; height: 22px; border-radius: 6px; background: var(--navy); color: #fff; font-family: var(--cond); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.ck { width: 100%; border-collapse: collapse; font-family: var(--cond); font-size: 16px; }
.ck th { background: #b3122e; color: #fff; text-align: left; padding: 6px 8px; }
.ck td { border-bottom: 1px solid var(--line); padding: 5px 8px; font-weight: 700; }
.ck td.v { text-align: right; } .ck td.w { width: 40px; text-align: center; color: var(--ink-2); }
.ck caption { text-align: left; font-family: var(--font); font-size: 12px; color: var(--ink-2); padding-bottom: 4px; }
body.quizmode .hideable { background: #dfe6f3; color: transparent !important; border-radius: 6px; cursor: pointer; }
body.quizmode .hideable.shown { background: #fff3b0; color: var(--path) !important; }

@media (max-width: 760px) {
  .brand small { display: none; } .brand { font-size: 15px; }
  .tabs button { padding: 6px 8px; font-size: 13px; }
  .top { gap: 6px; padding: 0 8px; }
  .legend { display: none; }
  .mem { columns: 1; }
  .lines { padding-left: 8px; }
}
@media (max-width: 520px) { .brand { display: none; } .tabs { margin-left: 0; } }

/* ============ PRINT ============ */
body.print { overflow: visible; background: #fff; font-size: 12.5px; }
body.print .top, body.print .zoom, body.print .ph .bar, body.print .page { display: none !important; }
body.print #view { position: static; }
body.print #panel { position: static; transform: none; width: auto; box-shadow: none; }
body.print .pbody { overflow: visible; padding: 8px 0; }
body.print details.step > summary { break-inside: avoid; }
body.print .ln, body.print .box { break-inside: avoid; }
body.print .fig svg { max-height: 120mm; width: auto; max-width: 100%; }
body.print .figs2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
</style>
</head>
<body>
<div class="top">
  <div class="brand">B737 Normal Procedures<small>OM-B SCAT B737 CL-NG, Issue 06 Rev 01 · только по документу</small></div>
  <div class="tabs" id="tabs"><button data-t="CL">Classic</button><button data-t="NG">NG</button><button data-t="DIFF">Отличия</button><button data-t="APP">Заходы</button></div>
  <button class="quiz" id="quiz" type="button">Проверь себя</button>
</div>

<div id="view">
  <div id="mapWrap"><svg id="map" class="mp" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="zoom"><button id="zin" aria-label="Приблизить">+</button><button id="zout" aria-label="Отдалить">−</button><button id="zfit" aria-label="Вся карта" style="font-size:15px">⤢</button></div>
  <div class="legend">
    <span><i style="background:var(--hl)"></i>Процедура (клик — открыть)</span>
    <span><i style="background:var(--link);height:4px"></i>Связь процедуры с блоком</span>
    <span><i style="background:var(--red);height:4px"></i>Точка профиля (2.3.2 Callouts)</span>
    <span><i style="background:var(--path);height:4px"></i>Траектория</span>
    <span><i style="background:var(--fo);border-radius:50%;width:12px"></i>F/O <i style="background:var(--capt);border-radius:50%;width:12px"></i>Captain <i style="background:var(--both);border-radius:50%;width:12px"></i>вместе</span>
  </div>
</div>
<div class="page" id="pDIFF"></div>
<div class="page" id="pAPP"></div>

<aside id="panel" aria-label="Процедура"><div class="ph" id="ph"></div><div class="pbody" id="pbody"></div></aside>

<script src="data.js"></script>
<script src="map.js"></script>
<script>
(() => {
const D = window.OMB, M = window.MAP;
const CL = new Set(D.clTails), NG = new Set(D.ngTails);
const P = new URLSearchParams(location.search);
const PRINT = P.get('print');           // CL | NG
const ONLY = P.get('only');             // phase id for print
const PART = P.get('part');             // map | proc
let type = PRINT || (() => { try { return localStorage.getItem('b737t') || 'CL'; } catch (e) { return 'CL'; } })();
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const WHO = { FO: ['F/O', '#1d5fd6'], C: ['Captain', '#d4570b'], B: ['Captain + F/O', '#0b8a5a'], CFO: ['Captain или F/O', '#0b8a5a'], '-': ['Не указано', '#7a869e'] };
const pdf = ch => ch.split(/[–-]/).map(x => +x + 68).join('–');

/* ---------- applicability ---------- */
const tails = l => l.split(',').map(s => s.trim());
function applies(tag, t) {
  if (!tag) return true;
  const set = t === 'CL' ? CL : NG;
  if (tag === 'CL' || tag === 'NG') return tag === t;
  if (tag.startsWith('T:')) return tails(tag.slice(2)).some(x => set.has(x));
  if (tag.startsWith('X:')) { const ex = new Set(tails(tag.slice(2))); return [...set].some(x => !ex.has(x)); }
  const m = tag.match(/^(CL|NG)\+T:(.*)$/);
  return m ? (m[1] === t || tails(m[2]).some(x => set.has(x))) : true;
}
function badge(tag) {
  if (!tag) return '';
  if (tag === 'CL') return '<span class="tg CL">Только Classic</span>';
  if (tag === 'NG') return '<span class="tg NG">Только NG</span>';
  if (tag.startsWith('T:')) return `<span class="tg T">Только ${tails(tag.slice(2)).map(x => 'UP-B' + x).join(', ')}</span>`;
  if (tag.startsWith('X:')) return `<span class="tg T">Кроме ${tails(tag.slice(2)).map(x => 'UP-B' + x).join(', ')}</span>`;
  const m = tag.match(/^(CL|NG)\+T:(.*)$/);
  return m ? `<span class="tg ${m[1]}">${m[1] === 'CL' ? 'Classic' : 'NG'} + ${tails(m[2]).map(x => 'UP-B' + x).join(', ')}</span>` : '';
}
const phase = id => D.phases.find(p => p.id === id);
function rowsFor(ph, t) {
  const out = [];
  ph.rows.forEach(r => {
    if (!applies(r.tag, t)) return;
    const lines = r.lines.filter(l => applies(l.tag, t));
    if (lines.length) out.push({ ...r, lines, n: out.length + 1, mk: t === 'CL' ? r.mock : (NG_READY.has(ph.id) ? r.mockNG : null) });
  });
  return out;
}
/* the map's "Preliminary" entry also carries the 2.2.10.1 Refueling subsection */
const SUB = { prelim: ['refuel'] };

/* ---------- mockup with flow ---------- */
function flowSVG(img, rows, opt = {}) {
  const [W, H] = D.img[img];
  const pts = rows.filter(r => r.mk && r.mk.img === img);
  const Z = ZONE[img] || [0, 0, W, H];
  if (!pts.length) return '';
  const xs = pts.map(r => r.mk.x * W), ys = pts.map(r => r.mk.y * H);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = Math.max(W * .07, (x1 - x0) * .12), py = Math.max(H * .05, (y1 - y0) * .12);
  x0 = Math.max(Z[0], x0 - px); x1 = Math.min(Z[2], x1 + px); y0 = Math.max(Z[1], y0 - py); y1 = Math.min(Z[3], y1 + py);
  const mw = Math.min(Z[2] - Z[0], W * .45), mh = Math.min(Z[3] - Z[1], H * (ZONE[img] ? .2 : .3));
  if (x1 - x0 < mw) { const c = (x0 + x1) / 2; x0 = Math.max(Z[0], Math.min(Z[2] - mw, c - mw / 2)); x1 = x0 + mw; }
  if (y1 - y0 < mh) { const c = (y0 + y1) / 2; y0 = Math.max(Z[1], Math.min(Z[3] - mh, c - mh / 2)); y1 = y0 + mh; }
  const R = Math.max(x1 - x0, (y1 - y0) * .9) * (opt.small ? .045 : .03);
  const groups = [];
  pts.forEach(r => { const x = r.mk.x * W, y = r.mk.y * H; let g = groups.find(g => Math.hypot(g.x - x, g.y - y) < R * .5); if (g) g.ns.push(r.n); else groups.push(g = { x, y, ns: [r.n], who: r.who }); r._g = g; });
  let path = '';
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1]._g, b = pts[i]._g; if (a !== b) path += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ffe066" stroke-width="${R * .3}" stroke-dasharray="${R * .9} ${R * .45}" marker-end="url(#ah${img}${opt.small ? 's' : ''})"/>`; }
  const dots = groups.map(g => { const lab = g.ns.join('/'), w = Math.max(R * 2, R * .62 * lab.length + R * .9);
    return `<g><rect x="${g.x - w / 2}" y="${g.y - R}" width="${w}" height="${2 * R}" rx="${R}" fill="${(WHO[g.who] || WHO['-'])[1]}" stroke="#fff" stroke-width="${R * .18}"/><text x="${g.x}" y="${g.y + R * .38}" text-anchor="middle" font-family="IBM Plex Sans Condensed,sans-serif" font-weight="700" font-size="${R * 1.05}" fill="#fff">${lab}</text></g>`; }).join('');
  const src = ZONE[img] ? 'img/ng-all.jpg' : `img/cl-${img}.jpg`;
  return `<svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" ${opt.attrs || ''}><defs><marker id="ah${img}${opt.small ? 's' : ''}" viewBox="0 0 10 10" refX="16" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffe066"/></marker></defs><image href="${src}" width="${W}" height="${H}"/>${path}${dots}</svg>`;
}
const IMGS = t => t === 'CL' ? ['ovh', 'ip', 'aft'] : ['ngovh', 'ngip', 'ngped'];
const ZONE = { ngovh: [380, 20, 1180, 1100], ngip: [60, 1100, 1480, 1760], ngped: [520, 1700, 1020, 2560] };
const NG_READY = new Set(['epu']); /* NG flow positions are placed per procedure */

/* ---------- map ---------- */
function mapSVG(t) {
  const out = [];
  const hlText = (x, y, txt, opts = {}) => {
    const fs = opts.fs || 30, w = txt.length * fs * .52 + 26;
    const ax = opts.anchor === 'end' ? x - w : opts.anchor === 'middle' ? x - w / 2 : x;
    return `<rect class="hl" x="${ax}" y="${y - fs * .95}" width="${w}" height="${fs * 1.35}" rx="6" fill="var(--hl)" opacity=".95"/><text x="${ax + 13}" y="${y}" font-size="${fs}" font-weight="600" fill="#0b1f3f">${esc(txt)}</text>`;
  };
  const hasData = id => !!phase(id);
  // title
  out.push(`<text x="60" y="110" font-size="64" font-weight="700" fill="#0b1f3f" font-family="IBM Plex Sans Condensed">737 ${t === 'CL' ? 'Classic' : 'NG'} · Normal Procedures</text><text x="62" y="160" font-size="28" fill="#44526e">OM-B SCAT, Issue 06 Rev 01 · глава 2.2 и 2.3.2 · клик по процедуре открывает её полностью</text>`);
  // ----- flight path -----
  const path = 'M1600 2010 L1600 2250 L3350 2250 L4000 1500 L4000 300 L2900 300 L2050 1150 L1350 1150 L1350 420';
  out.push(`<path d="${path}" fill="none" stroke="var(--path)" stroke-width="7" stroke-linejoin="round"/>`);
  out.push(`<line x1="2450" y1="2250" x2="3350" y2="2250" stroke="#7a4a1e" stroke-width="22" stroke-linecap="round"/><text x="3360" y="2300" font-size="22" fill="#7a4a1e">RWY (takeoff)</text>`);
  out.push(`<line x1="1350" y1="1150" x2="2050" y2="1150" stroke="#7a4a1e" stroke-width="22" stroke-linecap="round"/><text x="1360" y="1200" font-size="22" fill="#7a4a1e">RWY (landing)</text>`);
  // go-around dashed branch
  out.push(`<path d="M2060 1140 C 2200 1060, 2300 1020, 2380 1000" fill="none" stroke="var(--path)" stroke-width="5" stroke-dasharray="16 12"/>`);
  // aircraft at stand + tower
  out.push(`<g transform="translate(1520 1300)"><path d="M0 40 Q 20 10 90 10 L300 10 Q 330 10 340 30 Q 330 52 300 54 L60 54 Q 10 54 0 40Z" fill="#53c6f0" stroke="#0b1f3f" stroke-width="4"/><path d="M40 12 L10 -40 L40 -40 L90 12Z" fill="#53c6f0" stroke="#0b1f3f" stroke-width="4"/><path d="M150 40 L120 90 L170 90 L210 40Z" fill="#3aa9d6" stroke="#0b1f3f" stroke-width="3"/>${Array.from({ length: 14 }, (_, i) => `<rect x="${110 + i * 13}" y="24" width="7" height="9" rx="2" fill="#0b1f3f"/>`).join('')}<line x1="-20" y1="100" x2="420" y2="100" stroke="#7a4a1e" stroke-width="5"/><text x="360" y="90" font-size="26" fill="#5a3ea8" class="hand" font-size="34">Stand</text></g>`);
  // ----- ground: numbered list + cards -----
  const slots = [[40, 1240], [470, 1240], [900, 1240], [40, 1560], [470, 1560], [900, 1560], [40, 1880], [470, 1880], [900, 1880], [40, 2200], [470, 2200], [900, 2200]];
  M.ground.forEach((g, i) => {
    const y = 1470 + i * 54, x = 1500;
    const [cx, cy] = slots[i];
    const ckTxt = g.ck ? ` → checklist ${g.ck}` : '';
    out.push(`<path d="M${x - 10} ${y - 10} C ${x - 220} ${y - 10}, ${cx + 600} ${cy + 20}, ${cx + 400} ${cy + 30}" fill="none" stroke="var(--link)" stroke-width="5" opacity=".85"/>`);
    out.push(`<g class="node" data-id="${g.id}">${hlText(x, y, `${g.n}) ${g.t}`, { fs: 27 })}${g.ck ? `<text x="${x + g.t.length * 27 * .52 + 70}" y="${y}" font-size="22" fill="var(--link)" font-weight="600">→ ${esc(g.ck)}</text>` : ''}</g>`);
    // card
    const ph = phase(g.id);
    let inner = '';
    if (ph) {
      const rows = rowsFor(ph, t);
      const best = IMGS(t).map(im => [im, rows.filter(r => r.mk && r.mk.img === im).length]).sort((a, b) => b[1] - a[1])[0];
      inner = best && best[1] ? flowSVG(best[0], rows, { small: true, attrs: `x="${cx + 10}" y="${cy + 54}" width="380" height="210" preserveAspectRatio="xMidYMid slice"` }) : '';
    }
    if (!inner) inner = `<text x="${cx + 200}" y="${cy + 165}" text-anchor="middle" font-size="20" fill="#7a869e">${ph ? 'flow: органов нет на макете' : 'flow — на следующем этапе'}</text>`;
    out.push(`<g class="node" data-id="${g.id}"><rect x="${cx}" y="${cy}" width="400" height="290" rx="16" fill="#fff" stroke="#c8d0de" stroke-width="2"/><text x="${cx + 14}" y="${cy + 36}" font-size="24" font-weight="700" fill="#d62828" class="hand" style="font-size:32px">${esc(g.t.replace(/ Procedure| – Captain and First Officer/g, '').slice(0, 34))}</text>${inner}<text x="${cx + 14}" y="${cy + 282}" font-size="16" fill="#44526e">OM-B ${g.sec} · стр. ${g.ch} (PDF ${pdf(g.ch)})${ph ? '' : ' · не заполнено'}</text></g>`);
  });
  // ----- flight procedure nodes + boxes -----
  M.flight.forEach(f => {
    const [bx, by] = f.box, bw = 400, bh = f.bh || 150;
    out.push(`<path d="M${f.x} ${f.y} C ${f.x} ${(f.y + by) / 2}, ${bx + bw / 2} ${(f.y + by) / 2}, ${bx + bw / 2} ${by + (by > f.y ? 0 : bh)}" fill="none" stroke="var(--link)" stroke-width="5"/>`);
    out.push(`<g class="node" data-id="${f.id}"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="10" fill="#fff" stroke="#0b1f3f" stroke-width="3"/><text x="${bx + 16}" y="${by + 40}" font-size="25" font-weight="700" fill="#0b1f3f">${esc(f.t)}</text><text x="${bx + 16}" y="${by + 76}" font-size="19" fill="#44526e">OM-B ${f.sec} · стр. ${f.ch} (PDF ${pdf(f.ch)})</text>${f.ck ? `<text x="${bx + 16}" y="${by + (bh < 150 ? 100 : 108)}" font-size="18" fill="var(--link)" font-weight="600">checklist: ${esc(f.ck)}</text>` : ''}<text x="${bx + 16}" y="${by + bh - 8}" font-size="15" fill="#7a869e">${hasData(f.id) ? '' : 'действия — на следующем этапе'}</text></g>`);
    out.push(`<g class="node" data-id="${f.id}"><circle cx="${f.x}" cy="${f.y}" r="11" fill="#0b1f3f"/>${hlText(f.x + (f.lx || 22), f.y + (f.ly || -18), f.t.replace(' (7 видов захода)', ''), { fs: 24 })}</g>`);
  });
  // ----- points from 2.3.2 -----
  M.points.forEach(p => {
    const L = p.L || 46;
    let tx = p.x, ty = p.y, anchor = 'start', lx2 = p.x, ly2 = p.y;
    if (p.side === 't') { ly2 = p.y - L; ty = ly2 - 10; anchor = 'middle'; }
    if (p.side === 'b') { ly2 = p.y + L; ty = ly2 + 26; anchor = 'middle'; }
    if (p.side === 'l') { lx2 = p.x - L; tx = lx2 - 8; anchor = 'end'; ty = p.y + 7; }
    if (p.side === 'r') { lx2 = p.x + L; tx = lx2 + 8; ty = p.y + 7; }
    const t2 = p.t.length > 60 ? p.t.slice(0, 58) + '…' : p.t;
    out.push(`<g><title>${esc(p.t)} — OM-B 2.3.2, стр. ${p.ch} (PDF ${pdf(p.ch)})</title><circle cx="${p.x}" cy="${p.y}" r="8" fill="var(--red)"/><line x1="${p.x}" y1="${p.y}" x2="${lx2}" y2="${ly2}" stroke="var(--red)" stroke-width="3"/><text x="${tx}" y="${ty}" font-size="21" fill="var(--red)" text-anchor="${anchor}">${esc(t2)}</text></g>`);
  });
  return out.join('');
}

/* ---------- pan / zoom ---------- */
const svg = document.getElementById('map'), wrap = document.getElementById('mapWrap');
let vb = { x: 0, y: 0, w: M.W, h: M.H };
function setVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fit() { const r = wrap.getBoundingClientRect(), k = Math.max(M.W / r.width, M.H / r.height); vb = { w: r.width * k, h: r.height * k, x: (M.W - r.width * k) / 2, y: (M.H - r.height * k) / 2 }; setVB(); }
function zoomAt(f, cx, cy) { const r = wrap.getBoundingClientRect(); const px = vb.x + (cx - r.left) / r.width * vb.w, py = vb.y + (cy - r.top) / r.height * vb.h; const nw = Math.min(M.W * 1.6, Math.max(500, vb.w * f)); const k = nw / vb.w; vb = { x: px - (px - vb.x) * k, y: py - (py - vb.y) * k, w: nw, h: vb.h * k }; setVB(); }
const ptrs = new Map(); let moved = 0, lastDist = 0;
wrap.addEventListener('pointerdown', e => { wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; wrap.classList.add('drag'); });
wrap.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = wrap.getBoundingClientRect();
  if (ptrs.size === 1) { const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy); vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h; setVB(); }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (lastDist) zoomAt(lastDist / d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); lastDist = d; moved = 99; }
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) lastDist = 0; if (!ptrs.size) wrap.classList.remove('drag'); };
wrap.addEventListener('pointerup', e => { const was = moved; up(e); if (was < 8) { const n = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node'); if (n) openProc(n.dataset.id); } });
wrap.addEventListener('pointercancel', up);
wrap.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
document.getElementById('zin').onclick = () => { const r = wrap.getBoundingClientRect(); zoomAt(1 / 1.4, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById('zout').onclick = () => { const r = wrap.getBoundingClientRect(); zoomAt(1.4, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById('zfit').onclick = fit;
addEventListener('resize', fit);

/* ---------- procedure panel ---------- */
const ORDER = M.ground.map(g => g.id).concat(M.flight.map(f => f.id));
const META = id => M.ground.find(g => g.id === id) || M.flight.find(f => f.id === id);
function line(l) {
  const b = badge(l.tag);
  switch (l.k) {
    case 'A': return `<div class="ln act">${b}${esc(l.item)} <span class="dots">……</span> <span class="val hideable">${esc(l.val)}</span></div>`;
    case 'V': return `<div class="ln ver">${b}${esc(l.text)}</div>`;
    case 'X': return `<div class="ln instr">${b}${esc(l.text)}</div>`;
    case 'K': return `<div class="ln"><b class="hideable">“${esc(l.text)}”</b></div>`;
    case 'H': return `<div class="hd">${esc(l.text)}</div>`;
    case 'N': return `<div class="box N">${b}<b class="k">NOTE</b>${esc(l.text)}</div>`;
    case 'C': return `<div class="box C">${b}<b class="k">CAUTION</b>${esc(l.text)}</div>`;
    case 'W': return `<div class="box W">${b}<b class="k">WARNING</b>${esc(l.text)}</div>`;
    case 'Q': return `<div class="box Q">${b}<b class="k">⚠ проверить</b>${esc(l.text)}</div>`;
  }
  return '';
}
function stepsHTML(ph, rows, open) {
  const type_ = type;
  return rows.map(r => {
    const w = WHO[r.who] || WHO['-'];
    const a = r.lines.find(l => l.k === 'A');
    return `<details class="step"${open ? ' open' : ''}><summary><span class="n" style="background:${w[1]}">${r.n}</span><span class="p">${badge(r.tag)}${esc(r.panel)}<small>${a ? esc(a.item) : ''}${r.mk ? '' : (type === 'NG' && !NG_READY.has(ph.id) ? ' · метка NG — на следующем этапе' : ' · макет отсутствует')}</small></span><span class="r">${w[0]}<br>стр. ${r.page.ch} · PDF ${r.page.pdf}</span></summary><div class="lines">${r.lines.map(line).join('')}</div></details>`;
  }).join('');
}
function procHTML(id, t, printMode) {
  const meta = META(id), ph = phase(id);
  const head = `<div class="sec">OM-B ${esc(meta.sec)} · стр. ${esc(meta.ch)} главы 2 (PDF ${pdf(meta.ch)})</div><h2>${esc(meta.t)}<span class="chip ${t}">${t === 'CL' ? '737 Classic' : '737 NG'}</span></h2>`;
  if (!ph) return { head: head + `<div class="meta">Эта процедура будет заполнена на следующем этапе (после утверждения вида).</div>`, body: `<div class="none">Шаги OM-B ${esc(meta.sec)} ещё не перенесены.</div>` };
  const subs = [ph].concat((SUB[id] || []).map(phase));
  const meta2 = `<div class="meta"><b>Когда:</b> ${ph.trigger.map(esc).join(' ')}${ph.callouts.map(c => ` · Callout ${c.who === 'C' ? 'Captain' : esc(c.who)}: <b>“${esc(c.text)}”</b>`).join('')}<br><b>Кто:</b> ${esc(ph.who)}${ph.intro.length ? `<br>${ph.intro.map(esc).join(' ')}` : ''}</div>`;
  let body = '';
  subs.forEach((sp, si) => {
    const rows = rowsFor(sp, t);
    const byWho = {};
    rows.forEach(r => (byWho[r.who] = byWho[r.who] || []).push(r));
    const figs = IMGS(t).map(im => { const s = flowSVG(im, rows); return s ? `<div class="fig"><h4>${esc(D.mockNames[im])}</h4>${s}</div>` : ''; }).join('');
    const miss = rows.filter(r => !r.mk).map(r => `${r.n}. ${esc(r.panel)}`);
    const title = si ? `<h3 style="font-family:var(--cond);margin:14px 4px 8px">${esc(sp.section)} ${esc(sp.title)} · стр. ${esc(sp.pages.ch)}</h3>${sp.trigger.concat(sp.intro).map(x => `<div class="ln instr" style="padding:0 4px">${esc(x)}</div>`).join('')}` : '';
    const callouts = rows.flatMap(r => r.lines.filter(l => l.k === 'K').map(l => `<div class="ln">${r.n}. <b class="hideable">“${esc(l.text)}”</b></div>`)).concat(sp.callouts.map(c => `<div class="ln">${c.who === 'C' ? 'Captain' : esc(c.who)}: <b class="hideable">“${esc(c.text)}”</b></div>`));
    const ck = D.checklists[sp.id] && D.checklists[sp.id][t];
    body += title +
      `<details class="sec"${printMode || !si ? ' open' : ''}><summary>Макет и flow <span class="cnt">${rows.filter(r => r.mk).length} из ${rows.length} шагов на макете</span></summary><div class="sbody"><div class="figlegend"><span><i style="background:#1d5fd6"></i>F/O</span><span><i style="background:#d4570b"></i>Captain</span><span><i style="background:#0b8a5a"></i>вместе / любой</span><span><i style="background:#ffe066;border-radius:2px;height:5px;width:20px"></i>маршрут руки (порядок шагов)</span></div><div class="${printMode ? 'figs2' : ''}">${figs || '<div class="none">На макете нет органов этой процедуры.</div>'}</div>${miss.length ? `<div class="none" style="margin-top:8px">Макет отсутствует для: ${miss.join('; ')}</div>` : ''}</div></details>` +
      Object.entries(byWho).map(([w, rs]) => `<details class="sec"${printMode || !si ? ' open' : ''}><summary><span class="rolebar" style="background:${(WHO[w] || WHO['-'])[1]}"></span>${(WHO[w] || WHO['-'])[0]} — шаги <span class="cnt">${rs.length} шагов · ${rs.reduce((a, r) => a + r.lines.length, 0)} строк OM-B</span></summary><div class="sbody">${stepsHTML(sp, rs, printMode)}</div></details>`).join('') +
      `<details class="sec"${printMode ? ' open' : ''}><summary>Callouts <span class="cnt">${callouts.length}</span></summary><div class="sbody">${callouts.join('') || '<div class="none">В тексте OM-B ' + esc(sp.section) + ' callouts нет.</div>'}</div></details>` +
      `<details class="sec"${printMode ? ' open' : ''}><summary>Checklist</summary><div class="sbody">${ck ? `<table class="ck"><caption>${esc(ck.src)} · PDF ${esc(ck.pdf)}</caption><tr><th colspan="3">${esc(D.checklists[sp.id].name)}</th></tr>${ck.items.map(x => `<tr><td>${esc(x.item)}</td><td class="v"><span class="hideable">${esc(x.val)}</span></td><td class="w">${esc(x.who)}</td></tr>`).join('')}</table>` : '<div class="none">OM-B не указывает checklist для этой процедуры.</div>'}</div></details>` +
      `<details class="sec"${printMode ? ' open' : ''}><summary>Flow по памяти</summary><div class="sbody"><ol class="mem">${rows.map(r => { const a = r.lines.find(l => l.k === 'A'); return `<li>${esc(a ? a.item : r.panel)}</li>`; }).join('')}</ol></div></details>`;
  });
  return { head: head + meta2, body };
}
let cur = null;
function openProc(id) {
  cur = id;
  document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  document.querySelectorAll(`.node[data-id="${id}"]`).forEach(n => n.classList.add('sel'));
  const { head, body } = procHTML(id, type);
  const k = ORDER.indexOf(id);
  document.getElementById('ph').innerHTML = head + `<div class="bar"><button data-a="prev"${k ? '' : ' disabled'}>← ${k ? esc(META(ORDER[k - 1]).t).slice(0, 28) : ''}</button><button data-a="next"${k < ORDER.length - 1 ? '' : ' disabled'}>${k < ORDER.length - 1 ? esc(META(ORDER[k + 1]).t).slice(0, 28) : ''} →</button><button data-a="open">Развернуть всё</button><button data-a="close">Свернуть всё</button><button class="x" data-a="x">✕ Карта</button></div>`;
  document.getElementById('pbody').innerHTML = body;
  document.getElementById('pbody').scrollTop = 0;
  document.getElementById('panel').classList.add('open');
  history.replaceState(null, '', `#${type}/${id}`);
}
document.getElementById('ph').addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
  const k = ORDER.indexOf(cur);
  if (a === 'prev' && k > 0) openProc(ORDER[k - 1]);
  if (a === 'next' && k < ORDER.length - 1) openProc(ORDER[k + 1]);
  if (a === 'open' || a === 'close') document.querySelectorAll('#pbody details').forEach(d => d.open = a === 'open');
  if (a === 'x') { document.getElementById('panel').classList.remove('open'); history.replaceState(null, '', `#${type}`); }
});
document.getElementById('pbody').addEventListener('click', e => { const h = e.target.closest('.hideable'); if (h && document.body.classList.contains('quizmode')) { e.preventDefault(); h.classList.toggle('shown'); } });
document.getElementById('quiz').onclick = () => { document.body.classList.toggle('quizmode'); document.querySelectorAll('.hideable.shown').forEach(x => x.classList.remove('shown')); };

/* ---------- tabs: differences + approaches ---------- */
function diffHTML() {
  const rows = [];
  const txt = l => l.k === 'A' ? `${l.item} …… ${l.val}` : l.text;
  const marked = tag => tag && /^(CL|NG)/.test(tag) || (tag && tag.startsWith('T:'));
  D.phases.forEach(ph => ph.rows.forEach(r => {
    const c = [], n = [];
    r.lines.forEach(l => { const tag = l.tag || r.tag; if (!marked(tag) || l.k === 'Q') return; const s = badge(tag) + esc(txt(l)); if (applies(tag, 'CL')) c.push(s); if (applies(tag, 'NG')) n.push(s); });
    if (c.length || n.length) rows.push(`<tr><td>${esc(ph.section)}<br><small>${esc(ph.title)}</small></td><td>${esc(r.panel)}<br><small>стр. ${r.page.ch}</small></td><td class="cl">${c.join('<br>') || '—'}</td><td class="ng">${n.join('<br>') || '—'}</td></tr>`);
  }));
  return `<h1>Отличия Classic vs NG</h1><p>Только строки, которые в OM-B помечены (CL), (NG), «NG only», «CL only» или отдельными бортами. Пока по заполненным процедурам: ${D.phases.map(p => esc(p.section)).join(', ')}.</p><table class="diff"><tr><th>Раздел</th><th>Панель</th><th>Classic</th><th>NG</th></tr>${rows.join('')}</table>`;
}
function appHTML() {
  return `<h1>Заходы на посадку</h1><p>Отдельный профиль для каждого из 7 заходов OM-B (точки и колонки PF | PM) будет построен после утверждения вида карты.</p><div class="apps">${M.approaches.map(a => `<div class="a"><b>${esc(a.t)}</b><small>OM-B ${a.sec} · стр. ${a.ch} (PDF ${pdf(a.ch)})</small><div class="none" style="margin-top:10px">Профиль захода — на следующем этапе</div></div>`).join('')}</div>`;
}
function setTab(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p' + t));
  document.getElementById('view').style.display = (t === 'CL' || t === 'NG') ? '' : 'none';
  if (t === 'CL' || t === 'NG') { type = t; try { localStorage.setItem('b737t', t); } catch (e) {} svg.innerHTML = mapSVG(t); fit(); if (cur && document.getElementById('panel').classList.contains('open')) openProc(cur); }
  else document.getElementById('panel').classList.remove('open');
  if (t === 'DIFF') document.getElementById('pDIFF').innerHTML = diffHTML();
  if (t === 'APP') document.getElementById('pAPP').innerHTML = appHTML();
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); });

/* ---------- print ---------- */
if (PRINT) {
  document.body.classList.add('print');
  if (PART === 'map') {
    document.querySelector('.top').remove(); document.getElementById('panel').remove();
    document.body.style.margin = 0;
    document.getElementById('view').innerHTML = `<svg viewBox="0 0 ${M.W} ${M.H}" class="mp" style="width:100%;height:auto;display:block">${mapSVG(PRINT)}</svg>`;
  } else {
    document.getElementById('view').remove();
    const { head, body } = procHTML(ONLY || 'epu', PRINT, true);
    document.getElementById('ph').innerHTML = head; document.getElementById('pbody').innerHTML = body;
  }
  return;
}
const [ht, hid] = location.hash.slice(1).split('/');
setTab(['CL', 'NG', 'DIFF', 'APP'].includes(ht) ? ht : type);
if (hid && META(hid)) openProc(hid);
})();
</script>
